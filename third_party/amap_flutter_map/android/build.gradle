plugins {
    id 'com.android.library'
}

android {
    namespace 'com.amap.flutter.map'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.amap.api:3dmap:8.1.0'
}
