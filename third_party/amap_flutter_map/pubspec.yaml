name: amap_flutter_map
description: Official AMap Flutter map plugin, locally patched for modern Android Gradle builds.
version: 3.0.0+campura.1
homepage: https://lbs.amap.com/

environment:
  sdk: '>=2.12.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.1
  meta: ^1.3.0
  plugin_platform_interface: ^2.0.0
  stream_transform: ^2.0.0
  amap_flutter_base:
    path: ../amap_flutter_base

flutter:
  plugin:
    platforms:
      android:
        package: com.amap.flutter.map
        pluginClass: AMapFlutterMapPlugin
  assets:
    - res/
